name: Build NISSKENZI+ Android APK

on:
  push:
    paths:
      - "morocco-tv/**"
      - ".github/workflows/android-tv-build.yml"
  pull_request:
    paths:
      - "morocco-tv/**"
      - ".github/workflows/android-tv-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle -p morocco-tv assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nisskenzi-plus-android-tv-debug
          path: morocco-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source bundle for performance review
        run: |
          mkdir -p source-review
          cp morocco-tv/app/src/main/java/tv/nisskenzi/moroccotv/VavooProvider.java source-review/
          cp morocco-tv/app/src/main/java/tv/nisskenzi/moroccotv/MainActivity.java source-review/
          cp morocco-tv/app/src/main/java/tv/nisskenzi/moroccotv/ChannelAdapter.java source-review/
          cp morocco-tv/app/build.gradle source-review/
          cp morocco-tv/app/src/main/AndroidManifest.xml source-review/
          cat > source-review/README.md <<'EOF'
          # NISSKENZI+ Android TV — source review bundle

          These are the current native Android source files for a speed/performance review. The project uses Java Android Views, not HTML/WebView.

          ## Where the engines are
          - VavooProvider.java: VAVOO catalogue pagination, API requests/signature handling, channel metadata, and stream resolution.
          - MainActivity.java: IPTV-org playlist fetching/parsing is currently implemented inside loadChannels(); it manages Android TV pages, catalog state, filters, playback, and source selection.
          - ChannelAdapter.java: virtualized RecyclerView rows, D-pad focus/selection styling, favorite indicators, and asynchronous logo loading/cache.
          - build.gradle: dependency versions and Android build settings.
          - AndroidManifest.xml: app permissions and TV launcher declarations.

          ## Suggested performance review
          Inspect blocking I/O, number of network requests, pagination, JSON/M3U parsing, allocations, shared-preferences cache serialization, logo fetching/decoding, UI-thread view creation, lifecycle cancellation, and duplicate network work. Keep VAVOO and IPTV-org catalogues separate. Preserve native Android TV / D-pad navigation and do not replace the UI with HTML/WebView.

          Do not assume the VAVOO service endpoints or signatures are stable; failures need graceful handling and must not crash the app.
          EOF
          zip -r nisskenzi-android-tv-engine-source.zip source-review
      - name: Upload engine source bundle
        uses: actions/upload-artifact@v4
        with:
          name: nisskenzi-android-tv-engine-source
          path: nisskenzi-android-tv-engine-source.zip
          if-no-files-found: error
          retention-days: 7
