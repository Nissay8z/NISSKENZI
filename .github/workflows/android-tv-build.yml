name: Build NISSKENZI+ Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "morocco-tv/**"
      - ".github/workflows/android-tv-build.yml"
  pull_request:
    paths:
      - "morocco-tv/**"
      - ".github/workflows/android-tv-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle -p morocco-tv assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nisskenzi-plus-android-tv-debug
          path: morocco-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source bundle for performance review
        run: |
          mkdir -p source-review
          cp morocco-tv/app/src/main/java/tv/nisskenzi/moroccotv/*.java source-review/
          cp morocco-tv/app/build.gradle source-review/
          cp morocco-tv/app/src/main/AndroidManifest.xml source-review/
          mkdir -p source-review/assets
          cp morocco-tv/app/src/main/assets/vavoo_catalog.json source-review/assets/
          cp morocco-tv/app/src/main/assets/vavoo_catalog.m3u source-review/assets/
          cp morocco-tv/app/src/main/assets/iptv_org_catalog.m3u source-review/assets/
          cp scripts/refresh-vavoo-catalog.mjs source-review/
          cat > source-review/README.md <<'EOF'
          # NISSKENZI+ Android TV — source review bundle

          These are the current native Android source files for a speed/performance review. The project uses Java Android Views, not HTML/WebView.

          ## Where the engines are
          - MainActivity.java: native Android TV layout, source selection, playback lifecycle, and UI state.
          - Channel.java / ChannelFilter.java: immutable channel model with precomputed search index and worker-thread filtering.
          - ChannelAdapter.java / ChannelLogoLoader.java: recycled RecyclerView rows, D-pad focus, bounded cancellable logo loading.
          - CatalogCache.java / FavoritesStore.java / RecentChannelsStore.java: per-source local caches and in-memory user indexes.
          - VavooProvider.java / IptvOrgProvider.java: separate catalog providers and network parsing.
          - VavooSnapshotProvider.java: stream-parses the preloaded all-country VAVOO M3U; stream resolution remains in VavooProvider.
          - assets/vavoo_catalog.m3u and assets/iptv_org_catalog.m3u: bundled all-country metadata/playlists for local-first startup.
          - refresh-vavoo-catalog.mjs: updater for both embedded M3U catalogues.
          - EpgProvider.java: on-demand compressed XMLTV lookup for IPTV-org tvg-id and VAVOO name matches.
          - NativeLivePlayerView.java / PlayerChannelDrawerAdapter.java: fullscreen controller, left channel drawer, and EPG preview.
          - build.gradle: dependency versions and Android build settings.
          - AndroidManifest.xml: app permissions and TV launcher declarations.

          ## Suggested performance review
          Keep filtering off the UI thread, bound and cancel logo downloads, preserve source-specific caches, inspect pagination and JSON/M3U parsing, and check lifecycle cancellation. Keep VAVOO and IPTV-org catalogues separate. Preserve native Android TV / D-pad navigation and do not replace the UI with HTML/WebView.

          Do not assume the VAVOO service endpoints or signatures are stable; failures need graceful handling and must not crash the app.
          EOF
          zip -r nisskenzi-android-tv-engine-source.zip source-review
      - name: Upload engine source bundle
        uses: actions/upload-artifact@v4
        with:
          name: nisskenzi-android-tv-engine-source
          path: nisskenzi-android-tv-engine-source.zip
          if-no-files-found: error
          retention-days: 7
