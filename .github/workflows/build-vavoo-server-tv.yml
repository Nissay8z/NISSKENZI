name: VAVOO Server TV APK
on:
  push:
    branches: [vavoo-server-tv-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK Android TV
        run: gradle --no-daemon -p vavoo-server-tv assembleDebug
      - name: Publier APK
        run: cp vavoo-server-tv/app/build/outputs/apk/debug/app-debug.apk VAVOO-Server-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VAVOO-Server-TV
          path: VAVOO-Server-TV.apk
      - name: Créer une version téléchargeable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=vavoo-server-tv-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" VAVOO-Server-TV.apk --clobber
          else
            gh release create "$TAG" VAVOO-Server-TV.apk --title "VAVOO Server TV v1 (test)" --notes "APK Android TV. Serveur IPTV local :8787, M3U et VAVOO. Flux non garantis." --latest=false
          fi
