name: Refresh NISSKENZI Cine and deploy

on:
  workflow_dispatch:
  schedule:
    # Refresh the licensed catalogue daily at 04:17 UTC.
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "catalog_builder.py"
      - "tests/test_catalog_builder.py"
      - "catalog.json"
      - ".github/workflows/catalogue-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nisskenzi-cine-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh licensed film catalogue
        run: python catalog_builder.py --output catalog.json

      - name: Commit catalogue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "Catalogue is unchanged."
          else
            git commit -m "chore: refresh licensed film catalogue"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html catalog.json _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
