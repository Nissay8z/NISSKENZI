name: Refresh embedded VAVOO global catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh-vavoo-catalog.mjs"
      - ".github/workflows/refresh-vavoo-catalog.yml"

permissions:
  contents: write
  actions: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate the complete all-country catalogue
        run: node scripts/refresh-vavoo-catalog.mjs
      - name: Commit changed catalogue
        id: commit
        run: |
          if git diff --quiet -- morocco-tv/app/src/main/assets/vavoo_catalog.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalogue changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add morocco-tv/app/src/main/assets/vavoo_catalog.m3u
            git commit -m "chore: refresh embedded VAVOO global catalogue"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK with the updated embedded catalogue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-tv-build.yml --ref main
