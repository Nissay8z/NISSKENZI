name: NISSKENZI catalogue refresh

on:
  workflow_dispatch:
  schedule:
    # UTC: approximately every six hours. GitHub may delay scheduled runs.
    - cron: "23 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh.yml"
      - "refresh_catalogue.py"
      - "sources.txt"
      - "sources-fr.txt"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: nisskenzi-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate worldwide catalogue
        env:
          NISSKENZI_PRIMARY_M3U_URL: ${{ secrets.NISSKENZI_PRIMARY_M3U_URL }}
        run: |
          python refresh_catalogue.py --sources sources.txt --output playlist.m3u --report catalogue-status.json \
            --epg-url https://iptv-org.github.io/epg/guides/fr.xml \
            --epg-url https://iptv-org.github.io/epg/guides/be.xml \
            --epg-url https://iptv-org.github.io/epg/guides/ch.xml \
            --epg-url https://iptv-org.github.io/epg/guides/de.xml \
            --epg-url https://iptv-org.github.io/epg/guides/es.xml \
            --epg-url https://iptv-org.github.io/epg/guides/it.xml \
            --epg-url https://iptv-org.github.io/epg/guides/pt.xml \
            --epg-url https://iptv-org.github.io/epg/guides/gb.xml \
            --epg-url https://iptv-org.github.io/epg/guides/us.xml \
            --epg-url https://iptv-org.github.io/epg/guides/ca.xml \
            --epg-url https://iptv-org.github.io/epg/guides/au.xml \
            --epg-url https://iptv-org.github.io/epg/guides/nl.xml \
            --epg-url https://iptv-org.github.io/epg/guides/pl.xml

      - name: Generate France catalogue
        run: |
          python refresh_catalogue.py --sources sources-fr.txt --output playlist-fr.m3u --report catalogue-status-fr.json \
            --epg-url https://iptv-org.github.io/epg/guides/fr.xml

      - name: Commit changed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist-fr.m3u catalogue-status.json catalogue-status-fr.json
          if git diff --cached --quiet; then
            echo "Generated catalogues are unchanged."
          else
            git commit -m "chore: refresh generated catalogues"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
