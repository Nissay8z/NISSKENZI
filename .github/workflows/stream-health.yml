name: NISSKENZI stream health sample

on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Playlist file to sample"
        required: true
        type: choice
        options:
          - playlist.m3u
          - playlist-fr.m3u
      sample_size:
        description: "Maximum URLs to probe (1-100)"
        required: true
        default: "80"
        type: choice
        options:
          - "20"
          - "50"
          - "80"
          - "100"

permissions:
  contents: read

jobs:
  health-sample:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sample stream availability
        run: |
          python check_streams.py "${{ inputs.playlist }}" \
            --limit "${{ inputs.sample_size }}" \
            --workers 8 \
            --timeout 8 \
            --output stream-health.json

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: nisskenzi-stream-health
          path: stream-health.json
          if-no-files-found: error
          retention-days: 7
