name: Build Morocco TV APK
on:
  push:
    paths:
      - 'morocco-tv/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morocco-tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morocco-TV-APK
          path: morocco-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
