plugins { id 'com.android.application' }

android {
    namespace 'tv.nisskenzi.moroccotv'
    compileSdk 36
    defaultConfig {
        applicationId 'tv.nisskenzi.moroccotv'
        minSdk 23
        targetSdk 28
        versionCode 15
        versionName '2.0.0'
        ndk {
            // ARM architectures cover typical Android phones and TV boxes; avoid bundling Intel VLC binaries.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    packaging {
        jniLibs {
            // Compress VLC native libraries in the installable APK instead of making it enormous.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    // Official VideoLAN LibVLC engine (independent of BOB's bundled binaries).
    implementation 'org.videolan.android:libvlc-all:3.7.7'
}
