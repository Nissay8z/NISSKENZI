<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#050812;--panel:#0c1423;--panel2:#101d30;--line:#1d304b;--cyan:#20d6ff;--muted:#94a8c4;--text:#f4f7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Roboto,Arial,sans-serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% -20%,#142e55,transparent 55%),#050812}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}.topbar{height:74px;min-height:74px;display:flex;align-items:center;gap:19px;padding:0 25px;border-bottom:1px solid #15243a;background:rgba(5,9,18,.96)}.brand{display:flex;align-items:center;gap:10px;min-width:195px}.brandmark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:25px;font-weight:900;background:linear-gradient(140deg,#14e0ff,#0758ff 50%,#a72aff);box-shadow:0 0 25px #006bff40}.brandname{font-size:20px;font-weight:900;letter-spacing:-.8px}.brandname i{font-style:normal;color:#9860ff}.tagline{display:block;font-size:8px;letter-spacing:2.1px;color:#91a9c9;margin-top:3px}.nav{display:flex;align-items:center;gap:3px;flex:1;min-width:0}.nav button{padding:10px 11px;border-radius:9px;background:transparent;color:#b7c5d9;font-size:12px;white-space:nowrap}.nav button.active,.nav button:hover{background:linear-gradient(120deg,#242063,#102f51);color:white;box-shadow:inset 0 -2px #8d50ff}.actions{display:flex;gap:7px}.round{width:36px;height:36px;border-radius:10px;background:#0e1929;border:1px solid #1a2b43;font-size:17px;color:#c9ddf6}
#view{padding:20px 27px 28px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#263b58 transparent}.hero{height:250px;border-radius:20px;position:relative;overflow:hidden;border:1px solid #24518b;background:linear-gradient(90deg,rgba(3,7,18,.98),rgba(4,13,31,.77) 43%,rgba(3,7,18,.05)),linear-gradient(0deg,rgba(4,8,18,.25),transparent),url('https://images.unsplash.com/photo-1674760726595-d12f5e45482a?auto=format&fit=crop&w=1600&q=85') center 46%/cover,#07152b;box-shadow:0 12px 45px #0008}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,#0646ff22 70%,#a900ff24);pointer-events:none}.hero-content{position:relative;padding:26px 31px;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;max-width:590px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#63dfff;font-weight:800;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#ff3b62;box-shadow:0 0 12px #ff285d}.hero h1{font-size:clamp(27px,3.3vw,42px);line-height:1.04;letter-spacing:-1.4px;margin:11px 0 9px;font-weight:900}.hero p{font-size:13px;line-height:1.55;color:#c1d0e7;margin:0;max-width:370px}.buttons{display:flex;gap:10px;margin-top:18px}.primary,.secondary{padding:11px 16px;border-radius:10px;font-size:12px;font-weight:800}.primary{background:linear-gradient(105deg,#007dff,#862eff);box-shadow:0 6px 20px #4a26ff5c}.secondary{background:#0a1728d9;border:1px solid #2b4567}.hero-badges{position:absolute;right:20px;bottom:18px;display:flex;gap:8px}.hero-badges span{font-size:10px;background:#071222c9;border:1px solid #2a4b72;border-radius:9px;padding:8px 10px;color:#d7e6fc}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:21px 1px 11px}.section-head h2{font-size:16px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.link{font-size:11px;color:#67cfff;background:transparent}.tiles{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px}.tile{min-height:85px;border-radius:14px;background:linear-gradient(145deg,#111d30,#080f1d);border:1px solid #1b2c45;display:flex;align-items:center;gap:10px;padding:12px;text-align:left}.tile:hover{border-color:#3767a0;background:linear-gradient(145deg,#172746,#0b1424)}.tileicon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(140deg,#073c6a,#25164c);border:1px solid #2463a1;color:#6fe1ff;flex-shrink:0}.tile strong{display:block;font-size:12px}.tile small{display:block;color:#8ea3be;font-size:10px;margin-top:4px;line-height:1.25}.rail{display:flex;gap:10px;overflow:auto;padding:1px 1px 8px}.popular{min-width:108px;height:73px;border-radius:12px;background:linear-gradient(140deg,#111b2b,#060d18);border:1px solid #1c2c43;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:8px}.logoimg{max-width:75px;max-height:29px;object-fit:contain}.logotext{font-weight:900;font-size:17px}.popular small{font-size:9px;color:#91a1b8;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feature{border:1px solid #1b2c45;background:linear-gradient(120deg,#0e192a,#080e19);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}.feature .sym{font-size:24px;color:#8d60ff}.feature strong{font-size:12px}.feature p{font-size:10px;color:var(--muted);margin:4px 0 0;line-height:1.4}.page-title{font-size:24px;font-weight:900;margin:1px 0 6px}.page-sub{font-size:12px;color:var(--muted);margin:0 0 18px}
.live-layout{height:calc(100% - 3px);min-height:390px;display:grid;grid-template-columns:175px minmax(280px,1fr) 230px;gap:12px}.pane{min-height:0;border:1px solid #1b2b43;background:#080f1a;border-radius:13px;overflow:hidden;display:flex;flex-direction:column}.pane-title{height:42px;min-height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #18283d;font-size:11px;font-weight:800}.pane-title small{font-size:10px;color:var(--muted);font-weight:400}.country-list,.channel-list{overflow:auto;padding:7px;scrollbar-width:thin;scrollbar-color:#2b4364 transparent}.country{display:flex;width:100%;align-items:center;gap:7px;padding:9px 8px;border-radius:8px;background:transparent;color:#b7c5d8;font-size:11px;text-align:left}.country.active,.country:hover{background:#122f55;color:white}.country .n{margin-left:auto;font-size:9px;color:#7990ae}.searchline{padding:8px;border-bottom:1px solid #17273d}.searchline input{width:100%;border:1px solid #223754;border-radius:8px;background:#050b15;color:white;padding:9px 10px;outline:none;font-size:11px}.channel{display:grid;grid-template-columns:47px minmax(0,1fr) 20px;align-items:center;gap:9px;width:100%;min-height:54px;padding:7px 9px;background:transparent;border-bottom:1px solid #101d2c;text-align:left}.channel:hover{background:#11233a}.ch-logo{width:43px;height:31px;border-radius:5px;background:#eff5ff;color:#10213a;display:grid;place-items:center;overflow:hidden;font-size:9px;font-weight:900}.ch-logo img{width:100%;height:100%;object-fit:contain}.ch-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch-meta{font-size:9px;color:#849ab8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{background:transparent;color:#ffce65;font-size:17px;padding:0}.preview{padding:13px;gap:9px}.preview-art{height:110px;border-radius:10px;background:linear-gradient(145deg,#0d4c80,#1b184b,#050a14);display:grid;place-items:center;font-size:35px;border:1px solid #263b5a}.preview h3{font-size:13px;margin:2px 0 0}.preview p{font-size:10px;color:var(--muted);line-height:1.45;margin:0}.muted-box{padding:24px;border:1px dashed #28415f;border-radius:13px;background:#0b1422;text-align:center;max-width:560px;margin:28px auto}.muted-box .big{font-size:31px;margin-bottom:10px;color:#a18dff}.muted-box h2{font-size:19px;margin:0 0 8px}.muted-box p{font-size:12px;line-height:1.6;color:#99acc7;margin:0 0 17px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:13px}.media-card{background:#0c1523;border:1px solid #1b2e46;border-radius:11px;overflow:hidden;text-align:left;padding:0}.media-card:hover{border-color:#4575b2}.poster{height:170px;background:linear-gradient(145deg,#172c48,#15132d,#080d16);display:grid;place-items:center;font-size:28px;color:#92a8cb;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.media-copy{padding:9px}.media-copy strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-copy small{font-size:9px;color:#8da2bf;display:block;margin-top:5px}.footer{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;color:#526986;font-size:9px;letter-spacing:1px}.flags{font-size:16px;letter-spacing:5px}
@media(max-width:1050px){.topbar{gap:8px;padding:0 12px}.brand{min-width:160px}.brandname{font-size:17px}.nav button{padding:9px 7px;font-size:10px}.actions{gap:4px}#view{padding:13px}.tiles{grid-template-columns:repeat(3,minmax(100px,1fr))}.live-layout{grid-template-columns:140px minmax(240px,1fr)}.preview-pane{display:none}.hero{height:225px}}
</style></head><body><div id="app"><header class="topbar">
<div class="brand"><div class="brandmark">N</div><div><div class="brandname">NISSKENZI<i>+</i></div><span class="tagline">LE DIVERTISSEMENT CONNECTÉ</span></div></div>
<nav class="nav" id="nav"><button class="active" data-page="Accueil">Accueil</button><button data-page="Live TV">Live TV</button><button data-page="Films">VOD</button><button data-page="Séries">Séries</button><button data-page="Sport">Sport</button><button data-page="Animés">Animés</button><button data-page="Favoris">Favoris</button><button data-page="Enfants">Enfants</button><button data-page="Cloud">Cloud</button></nav>
<div class="actions"><button class="round" onclick="searchToggle()" title="Rechercher">⌕</button><button class="round" onclick="NisskenziBridge.addSource()" title="Sources">＋</button><button class="round" onclick="NisskenziBridge.settings()" title="Paramètres">⚙</button></div></header><main id="view"></main></div>
<script>
var page="Accueil",allChannels=[],allMovies=[],allSeries=[],activeCountry="Tous les pays",searchText="",searchOpen=false,visibleLimit=100;
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flag(c){var v=(c||"").toLowerCase();if(v.indexOf("france")>=0||v==="fr")return"🇫🇷";if(v.indexOf("maroc")>=0||v.indexOf("morocco")>=0)return"🇲🇦";if(v.indexOf("alg")>=0)return"🇩🇿";if(v.indexOf("tun")>=0)return"🇹🇳";if(v.indexOf("belg")>=0)return"🇧🇪";if(v.indexOf("suisse")>=0||v.indexOf("switz")>=0)return"🇨🇭";if(v.indexOf("canad")>=0)return"🇨🇦";if(v.indexOf("états-unis")>=0||v.indexOf("united states")>=0)return"🇺🇸";if(v.indexOf("royaume")>=0||v.indexOf("united kingdom")>=0)return"🇬🇧";if(v.indexOf("espagne")>=0||v.indexOf("spain")>=0)return"🇪🇸";if(v.indexOf("ital")>=0)return"🇮🇹";if(v.indexOf("allem")>=0||v.indexOf("germany")>=0)return"🇩🇪";return"🌐"}
function setPage(p){page=p;visibleLimit=100;document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("active",b.dataset.page===p)});draw();if(p==="Live TV")NisskenziBridge.refreshStatus("Catalogue Live TV")}
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){setPage(b.dataset.page)})});
function searchToggle(){if(page!=="Live TV"&&page!=="Favoris")setPage("Live TV");var q=document.getElementById("chanSearch");if(q){q.focus();q.select()}}
function home(){return '<section class="hero"><div class="hero-content"><div class="eyebrow"><span class="dot"></span> LE DIRECT, PARTOUT</div><h1>Tout le divertissement.<br>En une seule app.</h1><p>Retrouve tes chaînes, films et séries dans une expérience unifiée, fluide et personnalisable.</p><div class="buttons"><button class="primary" onclick="setPage(\'Live TV\')">▶ &nbsp; Regarder maintenant</button><button class="secondary" onclick="NisskenziBridge.addSource()">＋ &nbsp; Mes sources</button></div></div><div class="hero-badges"><span>✦ Multi-sources</span><span>◉ HD / 4K*</span><span>★ Favoris</span></div></section><div class="section-head"><div><h2>Explore NISSKENZI+</h2><p>Tout ce que tu regardes, au même endroit.</p></div><button class="link" onclick="NisskenziBridge.addSource()">Gérer les sources ↗</button></div><div class="tiles">'+tile("Live TV","Chaînes du monde entier","▣","Live TV")+tile("Films","Ton catalogue VOD","▶","Films")+tile("Séries","Épisodes & saisons","▤","Séries")+tile("Sport","Le direct sportif","♜","Sport")+tile("Enfants","Espace adapté","☺","Enfants")+tile("Cloud","Tes fichiers personnels","☁","Cloud")+'</div><div class="section-head"><div><h2>Chaînes populaires</h2><p>Accès rapide au direct</p></div><button class="link" onclick="setPage(\'Live TV\')">Voir tout →</button></div><div class="rail" id="popular"></div><div class="grid2" style="margin-top:14px"><div class="feature"><span class="sym">◈</span><div><strong>Plusieurs sources, une seule interface</strong><p>Importe une playlist ou connecte un service compatible.</p></div></div><div class="feature"><span class="sym">⌘</span><div><strong>Ta navigation, à ta façon</strong><p>Recherche, pays et favoris pour retrouver rapidement tes contenus.</p></div></div></div><div class="footer"><span>FLUX PUBLICS OU SOURCES QUE TU ES AUTORISÉ À UTILISER</span><span class="flags">🇫🇷 🇩🇿 🇲🇦 🇹🇳 🇧🇪 🇨🇭 🇨🇦 🇺🇸 🇬🇧 🇪🇸 🇮🇹 🇩🇪</span></div>'}
function tile(title,sub,ico,target){return '<button class="tile" onclick="setPage(\''+target+'\')"><span class="tileicon">'+ico+'</span><span><strong>'+title+'</strong><small>'+sub+'</small></span></button>'}
function populatePopular(){var el=document.getElementById("popular");if(!el)return;var arr=allChannels.slice(0,20);if(!arr.length){el.innerHTML='<div class="feature" style="min-width:300px"><span class="sym">▣</span><div><strong>Aucune chaîne chargée pour le moment</strong><p>Connecte une source pour remplir ce rail.</p></div><button class="primary" onclick="NisskenziBridge.addSource()">＋ Source</button></div>';return;}el.innerHTML=arr.map(function(c,i){return '<button class="popular" onclick="setPage(\'Live TV\')">'+(c.logo?'<img loading="lazy" class="logoimg" src="'+esc(c.logo)+'" onerror="this.style.display=\'none\'">':'<span class="logotext" style="color:'+["#3c99ff","#ed405f","#e5ecff","#fff","#40d69b","#ef8852"][i%6]+'">'+esc(c.name).slice(0,12)+'</span>')+'<small>'+esc(c.name)+'</small></button>'}).join("")}
function countries(){var m={};allChannels.forEach(function(c){var p=(c.country||"Pays non précisé").trim();if(!p)p="Pays non précisé";if(p.indexOf("IPTV-ORG · ")===0)p=p.substring(11);m[p]=(m[p]||0)+1});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,150)}
function drawLive(){var v=document.getElementById("view"),opts=countries(),q=searchText.toLowerCase();var items=allChannels.map(function(c,i){c._i=i;return c}).filter(function(c){return (activeCountry==="Tous les pays"||(c.country||"Pays non précisé").toLowerCase().indexOf(activeCountry.toLowerCase())>=0)&&(!q||(c.name+" "+c.group+" "+c.country).toLowerCase().indexOf(q)>=0)});if(page==="Favoris")items=items.filter(function(c){return c.favorite});var shown=items.slice(0,visibleLimit);v.innerHTML='<div class="live-layout"><aside class="pane"><div class="pane-title">PAYS <small>'+allChannels.length+'</small></div><div class="country-list"><button class="country '+(activeCountry==="Tous les pays"?'active':'')+'" onclick="country(\'Tous les pays\')">🌐 <span>Tous les pays</span><span class="n">'+allChannels.length+'</span></button>'+opts.map(function(x){return '<button class="country '+(activeCountry===x[0]?'active':'')+'" onclick="country(\''+esc(x[0]).replace(/'/g,"&#39;")+'\')">'+flag(x[0])+' <span>'+esc(x[0])+'</span><span class="n">'+x[1]+'</span></button>'}).join("")+'</div></aside><section class="pane"><div class="pane-title"><span>CHAÎNES EN DIRECT</span><small>'+items.length+' chaînes</small></div><div class="searchline"><input id="chanSearch" placeholder="⌕ Rechercher une chaîne…" value="'+esc(searchText)+'" oninput="searchText=this.value;drawLive();var q=document.getElementById(\'chanSearch\');q.focus();q.setSelectionRange(q.value.length,q.value.length)"></div><div class="channel-list">'+(items.length?shown.map(function(c){return '<button class="channel" onclick="NisskenziBridge.playChannel('+c._i+')"><span class="ch-logo">'+(c.logo?'<img loading="lazy" src="'+esc(c.logo)+'" onerror="this.style.display=\'none\'">':esc(c.name.slice(0,6)))+'</span><span><span class="ch-name">'+esc(c.name)+'</span><span class="ch-meta">'+esc(c.group||c.country||"Direct")+'</span></span><span><span class="star" role="button" tabindex="0" onclick="event.stopPropagation();NisskenziBridge.toggleFavorite('+c._i+')">'+(c.favorite?'★':'☆')+'</span></span></button>'}).join("")+(items.length>shown.length?'<button class="secondary" style="width:100%;margin:10px 0" onclick="visibleLimit+=100;drawLive()">Afficher 100 chaînes suivantes · '+(items.length-shown.length)+' restantes</button>':''):'<div class="muted-box"><div class="big">▣</div><h2>Aucune chaîne trouvée</h2><p>Actualise le catalogue ou connecte une playlist.</p><button class="primary" onclick="NisskenziBridge.addSource()">＋ Ajouter une source</button></div>')+'</div></section><aside class="pane preview-pane"><div class="pane-title">APERÇU <small>LIVE</small></div><div class="preview"><div class="preview-art">▶</div><h3>Prêt à regarder</h3><p>Sélectionne une chaîne pour lancer le lecteur. La disponibilité dépend de la source.</p><button class="primary" onclick="NisskenziBridge.refresh()">↻ Actualiser les chaînes</button><button class="secondary" onclick="NisskenziBridge.addSource()">＋ Ajouter une source</button></div></aside></div>'}
function country(c){activeCountry=c;visibleLimit=100;drawLive()}
function drawMedia(type){var v=document.getElementById("view"),items=(type==="Films"?allMovies:allSeries).map(function(x,i){x._nativeIndex=i;return x});if(type==="Animés")items=items.filter(function(x){return /anime|animé|manga|japan/i.test((x.name||"")+" "+(x.group||""))});v.innerHTML='<div class="section-head" style="margin-top:0"><div><h1 class="page-title">'+(type==="Films"?"Films & documentaires":type==="Séries"?"Séries & saisons":"Animés & mangas")+'</h1><p class="page-sub">Catalogue des sources connectées · '+items.length+' contenus</p></div><button class="primary" onclick="NisskenziBridge.addSource()">＋ Connecter une source</button></div>'+(items.length?'<div class="cards">'+items.map(function(x,i){return '<button class="media-card" onclick="NisskenziBridge.playMedia(\''+type+'\','+(x._nativeIndex==null?i:x._nativeIndex)+')"><div class="poster">'+(x.poster?'<img loading="lazy" src="'+esc(x.poster)+'" onerror="this.style.display=\'none\'">':(type==="Films"?"▶":type==="Animés"?"✦":"▤"))+'</div><div class="media-copy"><strong>'+esc(x.name)+'</strong><small>'+esc(x.group||type)+'</small></div></button>'}).join("")+'</div>':'<div class="muted-box"><div class="big">'+(type==="Films"?"▶":type==="Animés"?"✦":"▤")+'</div><h2>Connecte ton catalogue '+type.toLowerCase()+'</h2><p>Les titres et jaquettes apparaîtront dès qu’une source compatible sera connectée. Les métadonnées seules ne fournissent pas de liens de lecture.</p><button class="primary" onclick="NisskenziBridge.addSource()">＋ Ajouter une source autorisée</button></div>')}
function drawSport(){var v=document.getElementById("view"),items=allChannels.map(function(c,i){c._i=i;return c}).filter(function(c){return /sport|football|foot|eurosport|bein|ligue|match|rugby|tennis|motogp|f1/i.test((c.name||"")+" "+(c.group||""))});v.innerHTML='<div class="section-head" style="margin-top:0"><div><h1 class="page-title">Sport en direct</h1><p class="page-sub">Chaînes sportives détectées · '+items.length+' chaînes</p></div><button class="primary" onclick="NisskenziBridge.addSource()">＋ Connecter une source</button></div>'+(items.length?'<div class="cards">'+items.map(function(c){return '<button class="media-card" onclick="NisskenziBridge.playChannel('+c._i+')"><div class="poster">'+(c.logo?'<img src="'+esc(c.logo)+'" onerror="this.style.display=\'none\'">':'⚽')+'</div><div class="media-copy"><strong>'+esc(c.name)+'</strong><small>'+esc(c.group||"Sport")+'</small></div></button>'}).join("")+'</div>':'<div class="muted-box"><div class="big">⚽</div><h2>Aucune chaîne sportive détectée</h2><p>Connecte une source contenant les chaînes sportives auxquelles tu as accès. Les horaires demandent un guide TV séparé.</p><button class="primary" onclick="NisskenziBridge.addSource()">＋ Ajouter une source</button></div>')}
function drawInfo(type){var v=document.getElementById("view"),isCloud=type==="Cloud",info=type==="Enfants"?["Espace enfants","Des contenus apparaîtront lorsqu’une source autorisée sera connectée.","☺"]:["Cloud personnel","Choisis une vidéo stockée sur ton appareil ou connecte une source compatible.","☁"],action=isCloud?"NisskenziBridge.openLocalFiles()":"NisskenziBridge.addSource()",label=isCloud?"Parcourir mes vidéos":"＋ Configurer";v.innerHTML='<div class="muted-box"><div class="big">'+info[2]+'</div><h2>'+info[0]+'</h2><p>'+info[1]+'</p><button class="primary" onclick="'+action+'">'+label+'</button><button class="secondary" style="margin-left:7px" onclick="setPage(\'Accueil\')">Retour accueil</button></div>'}
function draw(){var v=document.getElementById("view");if(page==="Accueil"){v.innerHTML=home();populatePopular();return}if(page==="Live TV"||page==="Favoris"){drawLive();return}if(page==="Films"||page==="Séries"||page==="Animés"){drawMedia(page);return}if(page==="Sport"){drawSport();return}drawInfo(page)}
function beginChannels(){allChannels=[]}
function appendChannelChunk(json){try{allChannels=allChannels.concat(JSON.parse(json)||[])}catch(e){}}
function finishChannels(){draw()}
function receiveChannels(json){beginChannels();appendChannelChunk(json);finishChannels()}
function updateChannelFavorite(index,value){if(index>=0&&index<allChannels.length)allChannels[index].favorite=value;draw()}
function receiveMedia(movies,series){try{allMovies=JSON.parse(movies)||[]}catch(e){allMovies=[]}try{allSeries=JSON.parse(series)||[]}catch(e){allSeries=[]}draw()}
