<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#080d16;--panel:#0e1726;--panel2:#121f32;--line:#20334c;--cyan:#38d5ff;--purple:#9166ff;--muted:#8ea3bf;--text:#f3f6fd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Roboto,Arial,sans-serif}body{overflow:hidden;background:radial-gradient(ellipse at 15% -15%,#14335b 0,transparent 44%),var(--bg)}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}.topbar{height:72px;min-height:72px;display:flex;align-items:center;gap:22px;padding:0 25px;background:#070c15ed;border-bottom:1px solid #172840}.brand{display:flex;align-items:center;gap:11px;min-width:210px}.brandmark{height:41px;width:41px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#36deff,#1b66ff 60%,#8d3dff);box-shadow:0 0 22px #178bff4a;font-weight:1000;font-size:25px}.brandname{font-size:21px;font-weight:900;letter-spacing:-.8px}.brandname em{font-style:normal;color:#9a73ff}.tagline{display:block;color:#7f96b5;font-size:8px;letter-spacing:2px;margin-top:3px}.nav{display:flex;align-items:center;gap:5px;flex:1}.nav button{border-radius:9px;background:transparent;color:#aebed4;padding:10px 14px;font-size:12px}.nav button.active,.nav button:hover{background:#182846;color:white;box-shadow:inset 0 -2px #8d65ff}.actions{display:flex;gap:8px}.iconbtn{height:37px;width:38px;border:1px solid #263a54;border-radius:10px;background:#111d2d;color:#c8ddfa;font-size:17px}.iconbtn:hover{border-color:var(--cyan)}
#view{padding:19px 25px 23px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#2a415e transparent}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}.heading h1{margin:0;font-size:24px;letter-spacing:-.6px}.heading p{margin:5px 0 0;color:var(--muted);font-size:11px}.pill{border:1px solid #29415f;background:#101c2c;color:#b3c7e1;border-radius:999px;padding:8px 13px;font-size:11px;white-space:nowrap}.pill.active,.pill:hover{border-color:#6952d7;background:#25204a;color:#fff}.primary{background:linear-gradient(105deg,#087dff,#7e44ff);border-radius:10px;padding:10px 14px;font-size:11px;font-weight:800;box-shadow:0 5px 18px #2736ae45}.secondary{background:#121f30;border:1px solid #2b405b;border-radius:10px;padding:10px 14px;font-size:11px;font-weight:700}.searchline{display:flex;align-items:center;gap:9px;margin:12px 0 15px}.searchline input{width:100%;min-width:0;background:#0d1725;color:white;border:1px solid #223750;border-radius:11px;padding:12px 14px;outline:none;font-size:12px}.searchline input:focus{border-color:#3d88ce}.small-label{font-size:9px;letter-spacing:1.3px;color:#7991af;font-weight:800;margin-bottom:9px}.country-row{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 10px;scrollbar-width:thin;scrollbar-color:#304762 transparent}.country-row button{flex:0 0 auto}.sectionbar{display:flex;align-items:center;justify-content:space-between;margin:11px 1px 12px;gap:12px}.sectionbar h2{margin:0;font-size:14px}.sectionbar span{font-size:10px;color:var(--muted)}.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.channel-card{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px;border-radius:13px;text-align:left;background:linear-gradient(145deg,#111e30,#0b1320);border:1px solid #1d3048;min-width:0}.channel-card:hover{background:#17273d;border-color:#356a9b;transform:translateY(-1px)}.logo{flex:0 0 52px;width:52px;height:45px;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:#eaf2fc;color:#15253d;font-size:10px;font-weight:900}.logo img{width:100%;height:100%;object-fit:contain}.channel-info{min-width:0;flex:1}.channel-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-meta{font-size:9px;color:#8da4c2;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{align-self:flex-start;color:#f5ce6b;background:transparent;font-size:18px;padding:0 1px}.statusbar{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:10px;color:#778ea9}.dot{width:7px;height:7px;border-radius:50%;background:#40d79d;box-shadow:0 0 9px #25d7a054}.empty{border:1px dashed #29415e;border-radius:14px;background:#0d1725;padding:36px 18px;text-align:center;margin:12px 0}.empty .symbol{font-size:30px;color:#8c79ff}.empty h3{font-size:17px;margin:11px 0 7px}.empty p{font-size:11px;line-height:1.6;color:var(--muted);max-width:420px;margin:0 auto 15px}.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.source-card{border:1px solid #213751;border-radius:15px;background:linear-gradient(145deg,#111e30,#0a121e);padding:19px;display:flex;flex-direction:column;gap:12px}.source-top{display:flex;align-items:center;gap:12px}.source-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#104b71,#20204a);color:#63dcff;font-size:22px;font-weight:900}.source-card h3{font-size:15px;margin:0}.source-card p{font-size:11px;color:var(--muted);line-height:1.55;margin:0}.source-state{font-size:10px;color:#80ddb7}.source-actions{display:flex;gap:8px;margin-top:auto}.source-actions button{flex:1}.footnote{font-size:9px;color:#5f7592;padding:14px 2px 0}.countbox{border:1px solid #20344d;background:#0e1928;border-radius:10px;padding:8px 10px;font-size:10px;color:#a5bad6;white-space:nowrap}
@media(max-width:800px){.topbar{padding:0 12px;gap:10px}.brand{min-width:150px}.brandname{font-size:17px}.tagline{font-size:7px}.nav button{padding:9px 8px}.actions{gap:4px}#view{padding:14px}.channel-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.heading h1{font-size:20px}}
</style></head><body><div id="app">
<header class="topbar"><div class="brand"><div class="brandmark">N</div><div><div class="brandname">NISSKENZI<em>+</em></div><span class="tagline">LIVE TV · MONDE ENTIER</span></div></div>
<nav class="nav"><button data-page="Live TV" class="active">Live TV</button><button data-page="Favoris">★ Favoris</button><button data-page="Sources">Connexions</button></nav>
<div class="actions"><button class="iconbtn" onclick="focusSearch()" title="Rechercher">⌕</button><button class="iconbtn" onclick="setPage('Sources')" title="Connexions">⛓</button><button class="iconbtn" onclick="NisskenziBridge.refresh()" title="Actualiser">↻</button></div></header><main id="view"></main></div>
<script>
var page="Live TV",allChannels=[],activeCountry="Tous les pays",sourceFilter="Toutes",searchText="",visibleLimit=120;
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function flag(c){var v=(c||"").toLowerCase();if(v==="fr"||v.indexOf("france")>=0)return"🇫🇷";if(v==="ma"||v.indexOf("maroc")>=0||v.indexOf("morocco")>=0)return"🇲🇦";if(v==="dz"||v.indexOf("alg")>=0)return"🇩🇿";if(v==="tn"||v.indexOf("tun")>=0)return"🇹🇳";if(v==="es"||v.indexOf("espagne")>=0||v==="spain")return"🇪🇸";if(v==="gb"||v.indexOf("royaume")>=0||v.indexOf("united kingdom")>=0)return"🇬🇧";if(v==="us"||v.indexOf("united states")>=0||v.indexOf("états-unis")>=0)return"🇺🇸";if(v==="de"||v.indexOf("allem")>=0||v==="germany")return"🇩🇪";if(v==="it"||v.indexOf("ital")>=0)return"🇮🇹";if(v==="be"||v.indexOf("belg")>=0)return"🇧🇪";if(v==="ch"||v.indexOf("suisse")>=0)return"🇨🇭";if(v==="ca"||v.indexOf("canad")>=0)return"🇨🇦";if(v==="pt"||v.indexOf("portugal")>=0)return"🇵🇹";if(v==="nl"||v.indexOf("nether")>=0||v.indexOf("pays-bas")>=0)return"🇳🇱";if(v==="tr"||v.indexOf("turqu")>=0||v.indexOf("turkey")>=0)return"🇹🇷";if(v==="br"||v.indexOf("brazil")>=0||v.indexOf("brésil")>=0)return"🇧🇷";if(v==="jp"||v.indexOf("japan")>=0||v.indexOf("japon")>=0)return"🇯🇵";if(v==="in"||v.indexOf("india")>=0||v.indexOf("inde")>=0)return"🇮🇳";return"🌐"}
function setPage(p){page=p;visibleLimit=120;if(window.NisskenziBridge)NisskenziBridge.setCurrentPage(p);document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("active",b.dataset.page===p)});draw()}
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){setPage(b.dataset.page)})});
function focusSearch(){if(page!=="Live TV"&&page!=="Favoris")setPage("Live TV");var q=document.getElementById("channelSearch");if(q){q.focus();q.select()}}
function countries(){var m={};allChannels.forEach(function(c){var p=(c.country||"Pays non précisé").trim()||"Pays non précisé";m[p]=(m[p]||0)+1});return Object.keys(m).sort(function(a,b){if(a==="Pays non précisé")return 1;if(b==="Pays non précisé")return -1;return a.localeCompare(b,"fr")}).map(function(k){return[k,m[k]]})}
function selectCountry(c){activeCountry=c;visibleLimit=120;drawLive()}
function selectSource(s){sourceFilter=s;visibleLimit=120;drawLive()}
function sourceName(c){return c.isVavoo?"VAVOO":"IPTV-ORG"}
function drawLive(){
 var v=document.getElementById("view"),opts=countries(),q=searchText.toLowerCase();
 var filtered=allChannels.map(function(c,i){c._i=i;return c}).filter(function(c){return (activeCountry==="Tous les pays"||(c.country||"Pays non précisé")===activeCountry)&& (sourceFilter==="Toutes"||sourceName(c)===sourceFilter)&&(!q||(c.name+" "+c.group+" "+c.country).toLowerCase().indexOf(q)>=0)});
 if(page==="Favoris")filtered=filtered.filter(function(c){return c.favorite});
 var shown=filtered.slice(0,visibleLimit);
 v.innerHTML='<div class="heading"><div><h1>'+(page==="Favoris"?"Mes chaînes favorites":"Télévision en direct")+'</h1><p>Catalogue mondial · VAVOO + IPTV-ORG</p></div><div class="countbox">'+filtered.length+' chaînes</div></div><div class="searchline"><input id="channelSearch" type="search" placeholder="⌕  Rechercher une chaîne ou un pays…" value="'+esc(searchText)+'" oninput="searchText=this.value;drawLive();var q=document.getElementById(\'channelSearch\');q.focus();q.setSelectionRange(q.value.length,q.value.length)"><button class="secondary" onclick="NisskenziBridge.refresh()">↻ Actualiser</button></div><div class="small-label">PAYS DISPONIBLES DANS LES CATALOGUES ('+opts.length+')</div><div class="country-row"><button class="pill '+(activeCountry==="Tous les pays"?"active":"")+'" onclick="selectCountry(\'Tous les pays\')">🌐 Tous les pays <b>'+allChannels.length+'</b></button>'+opts.map(function(x){return '<button class="pill '+(activeCountry===x[0]?"active":"")+'" onclick="selectCountry(\''+esc(x[0]).replace(/'/g,"&#39;")+'\')">'+flag(x[0])+' '+esc(x[0])+' <b>'+x[1]+'</b></button>'}).join("")+'</div><div class="country-row"><button class="pill '+(sourceFilter==="Toutes"?"active":"")+'" onclick="selectSource(\'Toutes\')">Toutes les sources</button><button class="pill '+(sourceFilter==="VAVOO"?"active":"")+'" onclick="selectSource(\'VAVOO\')">VAVOO</button><button class="pill '+(sourceFilter==="IPTV-ORG"?"active":"")+'" onclick="selectSource(\'IPTV-ORG\')">IPTV-ORG</button></div><div class="sectionbar"><h2>'+(activeCountry==="Tous les pays"?"Toutes les chaînes":esc(activeCountry))+'</h2><span>'+filtered.length+' résultats</span></div>'+(shown.length?'<div class="channel-grid">'+shown.map(function(c){return '<button class="channel-card" onclick="NisskenziBridge.playChannel('+c._i+')"><span class="logo">'+(c.logo?'<img loading="lazy" src="'+esc(c.logo)+'" onerror="this.style.display=\'none\'">':esc(c.name.slice(0,6)))+'</span><span class="channel-info"><span class="channel-name">'+esc(c.name)+'</span><span class="channel-meta">'+esc(sourceName(c))+' · '+esc(c.country||"Pays non précisé")+'</span></span><span class="star" role="button" tabindex="0" onclick="event.stopPropagation();NisskenziBridge.toggleFavorite('+c._i+')">'+(c.favorite?'★':'☆')+'</span></button>'}).join("")+'</div>'+(filtered.length>shown.length?'<div style="text-align:center;padding:16px"><button class="secondary" onclick="visibleLimit+=120;drawLive()">Afficher 120 chaînes suivantes · '+(filtered.length-shown.length)+' restantes</button></div>':''):'<div class="empty"><div class="symbol">▣</div><h3>'+(allChannels.length?"Aucune chaîne dans cette sélection":"Connexion aux catalogues en cours")+'</h3><p>'+(allChannels.length?"Ce pays ne contient aucune chaîne dans le catalogue chargé, ou ta recherche ne renvoie aucun résultat. Essaie l’autre source ou choisis « Tous les pays ».":"VAVOO et IPTV-ORG sont chargés automatiquement. Vérifie ta connexion ou actualise les catalogues.")+'</p><button class="primary" onclick="NisskenziBridge.refresh()">↻ Actualiser les catalogues</button></div>')+'<div class="statusbar"><span class="dot"></span> Catalogue chargé en mémoire · les flux peuvent varier selon leur disponibilité</div>';
}
function drawSources(){
 var v=document.getElementById("view");
 var s=(window.NisskenziBridge&&NisskenziBridge.getCatalogStatus)?NisskenziBridge.getCatalogStatus():"Chargement du statut…";
 v.innerHTML='<div class="heading"><div><h1>Connexions</h1><p>Les deux catalogues Live TV se mettent à jour automatiquement.</p></div><button class="primary" onclick="NisskenziBridge.refresh()">↻ Actualiser</button></div><div class="source-grid"><section class="source-card"><div class="source-top"><div class="source-icon">V</div><div><h3>VAVOO</h3><div class="source-state">Catalogue IPTV · découverte automatique</div></div></div><p>Récupère les chaînes VAVOO et leurs métadonnées disponibles. Leur pays est déterminé à partir des informations retournées par le catalogue.</p><div class="source-actions"><button class="primary" onclick="NisskenziBridge.refresh()">Reconnecter / actualiser</button></div></section><section class="source-card"><div class="source-top"><div class="source-icon">◉</div><div><h3>IPTV-ORG</h3><div class="source-state">Playlist publique internationale</div></div></div><p>Utilise la playlist officielle regroupée par pays, puis classe les chaînes selon le pays indiqué dans les métadonnées de la playlist.</p><div class="source-actions"><button class="primary" onclick="NisskenziBridge.refresh()">Reconnecter / actualiser</button><button class="secondary" onclick="setPage(\'Live TV\')">Voir les pays</button></div></section></div><div class="empty" style="text-align:left;max-width:none"><div class="small-label">DERNIER ÉTAT DU CATALOGUE</div><p id="catalogStatus" style="margin:0;white-space:pre-wrap">'+esc(s)+'</p></div><div class="footnote">IPTV-ORG répertorie des playlists par pays. L’application n’invente pas de chaînes pour un pays qui n’en a pas dans les sources.</div>';
}
function draw(){if(page==="Sources")drawSources();else drawLive()}
function beginChannels(){allChannels=[]}
function appendChannelChunk(json){try{allChannels=allChannels.concat(JSON.parse(json)||[])}catch(e){}}
function finishChannels(){draw()}
function receiveChannels(json){beginChannels();appendChannelChunk(json);finishChannels()}
function updateChannelFavorite(index,value){if(index>=0&&index<allChannels.length)allChannels[index].favorite=value;draw()}
function setCatalogStatus(text){var n=document.getElementById("catalogStatus");if(n)n.textContent=text}
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&document.activeElement&&document.activeElement.matches(".star[role=button]")){e.preventDefault();document.activeElement.click()}});
window.addEventListener("keydown",function(e){if(e.key==="Escape"||e.key==="Backspace"){if(page==="Favoris"||page==="Sources")setPage("Live TV")}});
window.addEventListener("load",function(){draw();if(window.NisskenziBridge)NisskenziBridge.ready()});
</script></body></html>
